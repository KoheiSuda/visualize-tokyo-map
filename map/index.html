<!DOCTYPE html>
<html lang="en">
    <head>
        <title>D3 test</title>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="css/sanitize.css" />
        <link rel="stylesheet" href="css/main.css" />
        <link rel="stylesheet" href="css/analog.css" />
        <link
            href="https://fonts.googleapis.com/css2?family=Graduate&display=swap"
            rel="stylesheet"
        />
        <!-- LeafletのCSSを追加 -->
        <link
            rel="stylesheet"
            href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css"
        />
        <!-- LeafletのJavaScriptを追加 -->
        <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
        <!-- jquery & iScroll -->
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.11.3/jquery.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/iScroll/5.2.0/iscroll.min.js"></script>
        <!--グローバル変数-->
        <script type="text/javascript" src="./js/d3.min.js"></script>
        <script src="./js/globals.js"></script>
    </head>

    <body>
        
        <script type="module" src="./js/main.js"></script>
        <div id="parameter">
            <label for="opa">Opacity:</label>
            <input
                type="range"
                min="1"
                max="100"
                value="10"
                step="1"
                id="opa"
            />
            <label for="rad">Radius:</label>
            <input
                type="range"
                min="0.1"
                max="12"
                value="8"
                step="0.1"
                id="rad"
            />
        </div>
        <div id="container">
            <div id="map" style="width: 80%; height: 100vh"></div>
            <div id="clock" style="width: 20%">
                <div id="Time">
                    <div id="currentDay"></div>
                    <div id="AMPM"></div>
                </div>
                <script src="./js/analog.js"></script>
                <button
                    id="autoplay-button"
                    class="play"
                    onclick="startAutoPlay()"
                ></button>
                <button id="show-stations">Stations</button>
                <div id="checkboxContainer"></div>
            </div>
        </div>
        <script
            type="text/javascript"
            src="./js/topojson.js"
            charset="utf-8"
        ></script>
        <div id="graph"></div>
        <!--<script type="text/javascript" src="./js/main.js"></script>-->
    </body>
</html>
