<!DOCTYPE html>
<html lang="en">
    <head>
        <title>D3 test</title>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="stylesheet" href="css/sanitize.css" />
        <link rel="stylesheet" href="css/main.css" />
        <!-- LeafletのCSSを追加 -->
        <link
            rel="stylesheet"
            href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css"
        />
        <!-- LeafletのJavaScriptを追加 -->
        <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
        <!-- jquery & iScroll -->
        <script src="https://ajax.googleapis.com/ajax/libs/jquery/1.11.3/jquery.min.js"></script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/iScroll/5.2.0/iscroll.min.js"></script>
    </head>

    <body>
        <div id="container">
            <div id="map" style="width: 80%; height: 4000px"></div>
            <div id="sliderContainer" style="width: 20%">
                <input
                    type="range"
                    min="0"
                    max="48"
                    value="0"
                    step="1"
                    id="myRange"
                />
                <svg id="infoText"></svg>

                <link
                    rel="stylesheet"
                    href="https://cdnjs.cloudflare.com/ajax/libs/roundSlider/1.3/roundslider.min.css"
                />
                <script src="https://cdnjs.cloudflare.com/ajax/libs/roundSlider/1.3/roundslider.min.js"></script>
                <div id="myRange"></div>
                <input type="time" id="timeInput" />
            </div>
        </div>
        <script type="text/javascript" src="./js/d3.min.js"></script>
        <script
            type="text/javascript"
            src="./js/topojson.js"
            charset="utf-8"
        ></script>
        <script type="module" src="./js/main.js"></script>
        <!--<script type="text/javascript" src="./js/main.js"></script>-->
    </body>
</html>
